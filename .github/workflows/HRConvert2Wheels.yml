# HRConvert2's build of PyMeshLab.
#
# Applies HRConvert2's patches with hrconvert2/apply.sh, builds & deploys PyMeshLab with its own scripts, & tests the
# build & then the wheel: every MeshLab sample & every small model in hrconvert2/test loads as stock PyMeshLab
# 2025.7.post1 loads it, & PyMeshLab's own tests pass. Where the repository holds the HRC_REPRODUCERS_KEY secret,
# the reproducers in hrconvert2/test/reproducers.tar.gz.enc are decrypted & each must end as reproducers.tsv says.
#
# Run it by hand from the Actions tab. With "release" ticked, it publishes the wheels & their SHA-256 sums as a
# release tagged hrconvert2-<PYML_VERSION>-<hrconvert2/BUILD_NUMBER>. The wheels keep upstream's version, & each
# carries pymeshlab/HRCONVERT2_BUILD.txt, which names the build & its patches. Every action is pinned to a commit.

name: HRConvert2 Wheels

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the wheels as a release'
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: 5.15.2

jobs:
  wheel:
    name: Wheel, ${{ matrix.os }}, Python ${{ matrix.pyversion }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-22.04-arm']
        pyversion: ['3.14']
    env:
      HRC_REPRODUCERS_KEY: ${{ secrets.HRC_REPRODUCERS_KEY }}
    steps:
    - name: Check out, with MeshLab & vcglib at the commits PyMeshLab pins
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Apply HRConvert2's patches
      run: bash hrconvert2/apply.sh

    - name: Update the package lists
      run: sudo apt-get update

    - name: Install Qt ${{ env.QT_VERSION }}
      if: matrix.os == 'ubuntu-22.04'
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: ${{ env.QT_VERSION }}
        setup-python: false

    - name: Install Ubuntu's Qt
      if: matrix.os == 'ubuntu-22.04-arm'
      run: sudo apt-get install -y qtbase5-dev qt5-qmake

    - name: Install Python ${{ matrix.pyversion }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.pyversion }}

    - name: Install the build's dependencies
      run: sh scripts/Linux/0_setup_env.sh

    - name: Build
      run: sh scripts/Linux/1_build.sh

    - name: Deploy
      run: sh scripts/Linux/2_deploy.sh

    - name: Make the wheel
      run: |
        python -m pip install wheel
        python -m pip wheel . -w wheels/ --no-deps

    - name: Test the build
      run: |
        sudo apt-get install -y libopengl0
        python -m pip install pytest numpy
        python hrconvert2/test/readers.py hrconvert2/test/samples.tsv --root . --module .
        python hrconvert2/test/readers.py hrconvert2/test/models.tsv --root . --module .
        python -m pytest --pyargs pymeshlab -m "not glcontext"

    - name: Test the build on the reproducers
      if: env.HRC_REPRODUCERS_KEY != ''
      run: |
        mkdir -p "$RUNNER_TEMP/reproducers"
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in hrconvert2/test/reproducers.tar.gz.enc -pass env:HRC_REPRODUCERS_KEY | tar -xzf - -C "$RUNNER_TEMP/reproducers"
        python hrconvert2/test/readers.py "$RUNNER_TEMP/reproducers/reproducers.tsv" --module .

    - name: Test the wheel
      run: |
        python -m venv "$RUNNER_TEMP/wheel"
        "$RUNNER_TEMP/wheel/bin/python" -m pip install numpy wheels/pymeshlab-*.whl
        "$RUNNER_TEMP/wheel/bin/python" hrconvert2/test/readers.py hrconvert2/test/samples.tsv --root .
        "$RUNNER_TEMP/wheel/bin/python" hrconvert2/test/readers.py hrconvert2/test/models.tsv --root .

    - name: Upload the wheel
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheel-${{ matrix.os }}-python${{ matrix.pyversion }}
        path: wheels/pymeshlab-*.whl
        if-no-files-found: error

  release:
    name: Release
    if: inputs.release
    needs: wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the wheels
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: wheel-*
        path: wheels
        merge-multiple: true

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(cat PYML_VERSION)
        BUILD=$(cat hrconvert2/BUILD_NUMBER)
        TAG="hrconvert2-$VERSION-$BUILD"
        cd wheels
        sha256sum pymeshlab-*.whl > SHA256SUMS
        cat SHA256SUMS
        gh release create "$TAG" pymeshlab-*.whl SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "PyMeshLab $VERSION, HRConvert2 build $BUILD" --notes "PyMeshLab $VERSION built with HRConvert2's patches. hrconvert2/README.md says what the build is & how it is made."
